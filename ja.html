<!doctype html>
<html lang="ja-JP" data-language="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeedf8"><meta name="description" content="与此同时 AtTheMoment：朋友之间的时区换算。"><title>与此同时 · AtTheMoment</title><link rel="icon" href="logo.png" type="image/png"><link rel="stylesheet" href="style.css"><script defer src="time.js"></script><script defer src="i18n.js"></script><script defer src="app.js"></script></head>
<body><main>
<header><a class="brand" href="./" aria-label="与此同时 AtTheMoment 首页"><img class="brand-logo" src="logo.png" alt=""><span class="brand-name">与此同时</span></a><button id="share" class="icon-button" aria-label="分享"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M18 2a4 4 0 1 1-2.52 7.1l-5.6 3.11a4 4 0 0 1 0 1.58l5.6 3.11a4 4 0 1 1-.98 1.75l-5.61-3.12a4 4 0 1 1 0-5.06l5.61-3.12A4 4 0 0 1 18 2Z"/></svg></button></header><div class="language-row"><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
<section class="planner" aria-label="选择约定时间"><div class="section-top"><label for="source">以谁的时间为基准？</label><button class="text-button" id="now">当前时间</button></div><select id="source" aria-label="基准朋友"></select><div class="date-time"><label>日期<input id="date" type="date" min="1900-01-01" max="2100-12-31" required></label><label>时间<input id="time" type="time" required></label></div><div id="time-error" class="error" role="alert" hidden></div><div id="fold-wrap" hidden><label for="fold">这一天有两个相同的时间，请选择</label><select id="fold"></select></div><div class="nudge"><button data-step="-60" aria-label="往前一小时">− 1 小时</button><span>挪一挪时间</span><button data-step="60" aria-label="往后一小时">+ 1 小时</button></div></section>
<div class="friends-title"><h2>与此同时 <span id="count"></span></h2><button id="manage" class="text-button">管理</button></div><section id="friends" aria-label="各地对应时间"></section><button id="add" class="add-button"><span>＋</span> 添加一位朋友</button>
</main>
<dialog id="friend-dialog"><form id="friend-form"><div class="dialog-top"><h2 id="dialog-title">朋友住在哪里？</h2><button type="button" class="icon-button close" aria-label="关闭">×</button></div><fieldset class="avatar-picker"><legend class="sr-only">选择头像</legend><div id="avatars"></div></fieldset><label for="name">名字</label><input id="name" placeholder="例如：我、小鱼、游戏搭子" maxlength="80" required autocomplete="off"><label for="city">城市 & 国家</label><input id="city" placeholder="搜索城市，例如：上海 / London, UK" autocomplete="off"><p id="search-hint" class="hint" aria-live="polite">输入中英文城市名，或选一个常用城市。</p><div id="results" class="results" aria-label="城市搜索结果"></div><a class="data-credit" href="https://open-meteo.com/en/docs/geocoding-api" target="_blank" rel="noopener">Open-Meteo / GeoNames · CC BY 4.0</a><p id="chosen" class="chosen" hidden></p><details class="manual"><summary>找不到城市？手动选择时区</summary><label for="manual-city">城市 / 国家名称</label><input id="manual-city" placeholder="填写地点"><label for="zone">IANA 时区</label><select id="zone"></select><button type="button" id="use-zone" class="text-button">使用这个地点</button></details><p id="form-error" class="error" role="alert" hidden></p><button type="submit" class="primary">添加朋友</button></form></dialog>
<dialog id="share-dialog"><div class="dialog-top"><h2>把这一刻分享出去</h2><button class="icon-button close" aria-label="关闭">×</button></div><button id="share-tool" class="primary">复制工具链接</button><button id="share-plan" class="secondary">复制这次约定的链接</button><p class="hint">约定链接会包含朋友姓名、地点与时间。</p><textarea id="copy-fallback" aria-label="请长按复制链接" readonly hidden></textarea></dialog>
<dialog id="import-dialog"><h2>朋友分享了一个约定</h2><p id="import-info"></p><p class="hint">载入后会替换这台设备上原来的名单和时间。</p><button id="import-yes" class="primary">载入这次约定</button><button id="import-no" class="secondary">保留我的名单</button></dialog>
<div id="toast" role="status" class="toast" hidden></div>
</body></html>
